<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zero City ルールテスト</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1d2330;--sub:#667085;--ok:#1a9e5c;--ng:#d6382f;--accent:#2f5bea;--line:#e3e6ec}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--text:#eef0f4;--sub:#9aa3b2;--line:#2b3240}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI","Meiryo",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;margin:8px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
.sub{color:var(--sub);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.cat{display:inline-block;font-size:.75rem;background:var(--accent);color:#fff;border-radius:99px;padding:1px 10px}
.q{font-size:1.15rem;font-weight:700;margin:12px 0 18px}
.btns{display:flex;gap:12px}
.btns button{flex:1;font-size:2.4rem;padding:12px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.btns button.sel{border-color:var(--accent);background:rgba(47,91,234,.15)}
.card.ok{border-color:var(--ok)}
.card.ng{border-color:var(--ng)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:6px 14px;font-size:.9rem;cursor:pointer}
.chip.on{border-color:var(--accent);background:rgba(47,91,234,.15)}
.btns button:disabled{opacity:.4}
.card.perfect{border:2px solid #e0a800;background:linear-gradient(160deg,rgba(224,168,0,.18),var(--card) 70%);text-align:center}
.big100{text-shadow:0 0 18px rgba(242,194,48,.55);font-size:5rem;font-weight:800;line-height:1.1;color:#c98f00;letter-spacing:.02em;animation:pop .6s ease-out}
.big100 span{font-size:1.6rem;margin-left:6px}
.pmsg{font-size:1.2rem;font-weight:700;margin:4px 0 6px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.big100{animation:none}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .big100{color:#f2c230}}
:root[data-theme="dark"] .big100{color:#f2c230}
.start:disabled{opacity:.45;cursor:not-allowed}
.btns button.cnt{font-size:1.3rem;padding:18px 0}
.btns button:hover:not(:disabled){border-color:var(--accent)}
.btns button:disabled{cursor:default;opacity:.55}
.btns button.pick{opacity:1}
.res{margin-top:16px;padding:12px 14px;border-radius:10px;display:none}
.res.ok{background:rgba(26,158,92,.13);border-left:4px solid var(--ok)}
.res.ng{background:rgba(214,56,47,.13);border-left:4px solid var(--ng)}
.res b{display:block;font-size:1.05rem}
.next,.start{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:1rem;cursor:pointer}
.score{font-size:2.6rem;font-weight:800;text-align:center}
.rev{border-top:1px solid var(--line);padding:10px 0;font-size:.92rem}
.rev:first-child{border-top:0}
</style>
</head>
<body>
<main>
<h1>Zero City ルールテスト 〇×</h1>
<div class="sub" id="head"></div>
<div class="bar"><i id="bar"></i></div>
<div id="app"></div>
</main>

["インパウンド","中型45分、大型・超大型60分。",[["中型犯罪のインパウンド時間は60分である。",false],["中型犯罪のインパウンド時間は45分である。",true],["大型犯罪のインパウンド時間は45分である。",false],["大型・超大型犯罪のインパウンド時間は60分である。",true]]],
["インパウンド","小型・特殊小型は30分。",[["小型犯罪のインパウンド時間は45分である。",false],["小型犯罪と特殊小型犯罪のインパウンド時間は、どちらも30分である。",true]]],
["保釈金","プリズンへ送られる『前』にPDへ申告。",[["保釈金の申告は、プリズンに送られた後でも可能である。",false],["保釈金の申告は、プリズンへ送られる前にPDへ行う。",true]]],
["保釈金","中型1000万円、大型2000万円、超大型4000万円。",[["中型犯罪の保釈金は2000万円である。",false],["中型犯罪の保釈金は1000万円である。",true],["大型犯罪の保釈金は2000万円である。",true],["超大型犯罪の保釈金は5000万円である。",false]]],
["保釈金","ブースティングA帯・S帯は700万円、小型・特殊小型は500万円、逃走幇助は300万円。",[["ブースティングA帯・S帯の保釈金は500万円である。",false],["ブースティングA帯・S帯の保釈金は700万円である。",true],["逃走幇助の保釈金は500万円である。",false],["小型犯罪の保釈金は500万円である。",true]]],
["保釈金","保釈金は罰金とは別に支払う。",[["保釈金は、罰金に含まれるため別途支払う必要はない。",false],["保釈金は、罰金とは別に支払う。",true]]],
["保釈金","請求を切った上で手錠をかけ、エスコートして警察署の外で解放。",[["保釈金を払う申告があった場合は、手錠をかけずに署内で解放する。",false],["保釈金を払う申告があった場合は、請求後、手錠をかけて警察署の外で解放する。",true]]],
["保釈金","記載の犯罪以外の単発犯罪は、保釈金制度の該当外。",[["どの単発犯罪でも、保釈金制度を利用できる。",false],["記載のない単発犯罪は、保釈金制度の該当外である。",true]]],
["押収対象","武器と犯罪道具は押収対象。基本的にアイテムの『押収物』表記が押収対象(例外の場合もある)。",[["犯罪に利用した武器・犯罪道具は、押収対象である。",true],["犯罪に利用した武器や犯罪道具は、押収対象にならない。",false],["アイテムに『押収物』と記載があれば、基本的に押収対象である。",true]]],
["基本ルール","職務中は警察装備・警察車両『のみ』。",[["職務中、警察装備を使えば、EVCのついていない車両でもよい。",false],["職務中は、警察装備・警察車両のみを使用する。",true]]],
["基本ルール","PD退勤後は、必ず私服に着替える。",[["PD退勤後は、PD服装のままでもよい。",false],["PD退勤後は、必ずPD服装から私服に着替える。",true]]],
["基本ルール","個人的な理由での逮捕・取り締まりは、どちらも禁止。",[["個人的な理由での逮捕は禁止だが、取り締まりは許される。",false],["個人的な理由での逮捕・取り締まりは、どちらも禁止である。",true]]],
["トラブル対応","独断行動は禁止。必ず上官へ報告し、指示に従う。",[["トラブルは、まず自分で対処し、解決後に上官へ報告する。",false],["トラブルが起きた際は、独断で動かず、上官へ報告して指示に従う。",true]]]
];

const app=document.getElementById('app'),head=document.getElementById('head'),bar=document.getElementById('bar');
let list,ans,graded;
const shuffle=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};

const CATS=[...new Set(G.map(g=>g[0]))];
let selCats=new Set(CATS);
function pool(){return G.filter(g=>selCats.has(g[0]))}
const ISL=g=>g[0]==='島取りダウン'||g[0]==='EMS・蘇生';
let incl=false,lastN=0;
function home(){
  head.textContent="問題数を選んでスタート";bar.style.width="0";
  const all=pool().length,noIsl=pool().filter(g=>!ISL(g)).length,isl=pool().filter(ISL).length;
  app.innerHTML='<div class="card"><p>Zero City のPDルールの理解度チェックです。全問に答えてから「答え合わせ」を押すと結果が出ます。</p>'+
  '<div class="sub" style="margin-top:14px">20問・25問・全問のとき、島取りの問題を</div>'+
  '<div class="chips"><button class="chip'+(incl?' on':'')+'" data-i="1">含む</button><button class="chip'+(incl?'':' on')+'" data-i="0">含まない</button></div>'+
  '<div class="sub" style="margin-top:14px">問題数(全'+(incl?all:noIsl)+'問)</div>'+
  '<div class="btns" style="margin-top:6px">'+[15,20,25].map(n=>'<button class="cnt" data-n="'+n+'">'+n+'問</button>').join('')+
  '<button class="cnt" data-n="0">全問</button></div>'+
  '<div class="sub" style="margin-top:14px">島取りだけ</div>'+
  '<div class="btns" style="margin-top:6px"><button class="cnt" data-n="-1">島取り用('+isl+'問)</button></div>'+
  '<div class="sub" style="margin-top:10px">15問は、島取りの問題を含みません。</div></div>';
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{incl=b.dataset.i==='1';home()});
  app.querySelectorAll('.cnt').forEach(b=>b.onclick=()=>start(+b.dataset.n));
}
function start(n){
  lastN=n;
  let pl=pool();
  if(n===-1)pl=pl.filter(ISL);
  else if(n===15)pl=pl.filter(g=>!/ブースティング|特殊小型|島取り/.test(g[0]+g[2].map(v=>v[0]).join('')));
  else if(!incl)pl=pl.filter(g=>!ISL(g));
  if(!pl.length)return;
  if(n<=0||n>pl.length)n=pl.length;
  list=shuffle(pl).slice(0,n).map(([c,e,v])=>{const p=v[Math.floor(Math.random()*v.length)];return [c,p[0],p[1],e]});
  ans=new Array(n).fill(null);graded=false;fxDone=false;render();window.scrollTo(0,0);
}
let fxDone=false;
function celebrate(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const dpr=window.devicePixelRatio||1,W=Math.round(innerWidth*dpr),H=Math.round(innerHeight*dpr);
  const mk=z=>{const c=document.createElement('canvas');c.width=W;c.height=H;c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:'+z;document.body.appendChild(c);return c};
  const cf=mk(50),fw=mk(51),xc=cf.getContext('2d'),xf=fw.getContext('2d');
  const fl=document.createElement('div');
  fl.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:52;background:radial-gradient(circle at 50% 40%,#fff,#ffe9a0 45%,rgba(255,200,60,0) 75%);opacity:.95;transition:opacity .9s ease-out';
  document.body.appendChild(fl);requestAnimationFrame(()=>requestAnimationFrame(()=>{fl.style.opacity='0'}));
  const cols=['#ffd23f','#ff4d6d','#3ddc97','#4cc9f0','#c77dff','#ff9f1c','#ffffff'];
  const rnd=(a,b)=>a+Math.random()*(b-a),pick=()=>cols[Math.floor(Math.random()*cols.length)];
  const S=[],C=[],R=[],K=[];
  function explode(cx,cy){
    const c1=pick(),c2=pick(),ring=Math.random()<.4,n=ring?70:130,big=rnd(.8,1.3);
    for(let i=0;i<n;i++){
      const a=ring?i/n*Math.PI*2:Math.random()*Math.PI*2,v=(ring?6:rnd(1,8))*dpr*big;
      S.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:i%2?c1:c2,s:rnd(1.8,3.6)*dpr,l:1,d:rnd(.008,.016)});
    }
    R.push({x:cx,y:cy,r:10*dpr,l:1,c:c1});
    for(let i=0;i<14;i++)S.push({x:cx,y:cy,vx:rnd(-3,3)*dpr,vy:rnd(-3,3)*dpr,c:'#ffffff',s:rnd(3,5)*dpr,l:1,d:.03});
  }
  function rocket(){const x=rnd(.12,.88)*W;K.push({x,y:H,vy:-rnd(11,16)*dpr,ty:rnd(.12,.45)*H})}
  function cannon(side){
    for(let i=0;i<45;i++){
      const sp=rnd(8,22)*dpr,a=side<0?rnd(-1.45,-.75):rnd(-2.4,-1.7);
      C.push({x:side<0?0:W,y:H*.95,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,c:pick(),s:rnd(8,15)*dpr,r:rnd(0,6),vr:rnd(-.35,.35),ph:rnd(0,6),l:1});
    }
  }
  function rain(){for(let i=0;i<22;i++)C.push({x:rnd(0,W),y:-20*dpr,vx:rnd(-1.5,1.5)*dpr,vy:rnd(2,5)*dpr,c:pick(),s:rnd(8,14)*dpr,r:rnd(0,6),vr:rnd(-.3,.3),ph:rnd(0,6),l:1,rain:1})}
  const t0=performance.now();let last=t0,nextR=0,nextC=0,cannons=0;
  function frame(now){
    const el=now-t0,k=Math.min(2.5,(now-last)/16.7||1);last=now;
    if(el<5500&&el>=nextR){nextR=el+rnd(160,360);rocket();if(Math.random()<.5)rocket()}
    if(el>=nextC&&el<4500){nextC=el+1400;cannon(-1);cannon(1);cannons++}
    if(el<5000&&Math.random()<.35)rain();
    xf.globalCompositeOperation='destination-out';xf.fillStyle='rgba(0,0,0,.2)';xf.fillRect(0,0,W,H);
    xf.globalCompositeOperation='lighter';
    for(let i=K.length-1;i>=0;i--){const r=K[i];r.y+=r.vy*k;r.vy*=.992;
      xf.globalAlpha=1;xf.fillStyle='#ffe9a0';xf.beginPath();xf.arc(r.x,r.y,2.5*dpr,0,7);xf.fill();
      if(r.y<=r.ty||r.vy>-3*dpr){explode(r.x,r.y);K.splice(i,1)}}
    for(const p of S){p.vy+=.07*dpr*k;p.vx*=Math.pow(.985,k);p.vy*=Math.pow(.985,k);p.x+=p.vx*k;p.y+=p.vy*k;p.l-=p.d*k;
      xf.globalAlpha=Math.max(p.l,0);xf.fillStyle=p.c;xf.beginPath();xf.arc(p.x,p.y,p.s,0,7);xf.fill()}
    for(const q of R){q.r+=14*dpr*k;q.l-=.045*k;xf.globalAlpha=Math.max(q.l,0);xf.strokeStyle=q.c;xf.lineWidth=3*dpr;xf.beginPath();xf.arc(q.x,q.y,q.r,0,7);xf.stroke()}
    xf.globalAlpha=1;
    xc.clearRect(0,0,W,H);
    for(const p of C){if(!p.rain){p.vy+=.35*dpr*k;p.vx*=Math.pow(.99,k)}else{p.vx+=Math.sin(el/300+p.ph)*.05*dpr}
      p.x+=p.vx*k;p.y+=p.vy*k;p.r+=p.vr*k;p.ph+=.2*k;if(!p.rain&&p.vy>0)p.vy=Math.min(p.vy,5*dpr);if(p.y>H*.9&&!p.rain)p.l-=.03*k;
      xc.globalAlpha=Math.max(p.l,0);xc.fillStyle=p.c;xc.save();xc.translate(p.x,p.y);xc.rotate(p.r);xc.scale(1,Math.cos(p.ph));xc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);xc.restore()}
    for(let i=S.length-1;i>=0;i--)if(S[i].l<=0)S.splice(i,1);
    for(let i=R.length-1;i>=0;i--)if(R[i].l<=0)R.splice(i,1);
    for(let i=C.length-1;i>=0;i--)if(C[i].y>H+40||C[i].l<=0||C[i].x<-80||C[i].x>W+80)C.splice(i,1);
    if(el<7500||S.length||C.length||K.length||R.length)requestAnimationFrame(frame);else{cf.remove();fw.remove();fl.remove()}
  }
  requestAnimationFrame(frame);
}
function render(){
  const done=ans.filter(v=>v!==null).length;
  head.textContent=graded?"結果":"回答済み "+done+" / "+list.length;
  bar.style.width=(done/list.length*100)+"%";
  let h='';
  list.forEach((q,k)=>{
    const a=ans[k];let cls='';
    if(graded)cls=a===q[2]?' ok':' ng';
    h+='<div class="card'+cls+'"><span class="cat">'+q[0]+'</span><div class="q">'+(k+1)+'. '+q[1]+'</div>'+
    '<div class="btns"><button data-k="'+k+'" data-v="1" class="'+(a===true?'sel':'')+'"'+(graded?' disabled':'')+'>〇</button>'+
    '<button data-k="'+k+'" data-v="0" class="'+(a===false?'sel':'')+'"'+(graded?' disabled':'')+'>×</button></div>';
    if(graded)h+='<div class="res '+(a===q[2]?'ok':'ng')+'" style="display:block"><b>'+
      (a===null?'未回答 / 正解は '+(q[2]?'〇':'×'):a===q[2]?'〇 正解!':'× 不正解… 正解は '+(q[2]?'〇':'×'))+'</b>'+q[3]+'</div>';
    h+='</div>';
  });
  if(!graded){
    h+='<button class="start" id="g"'+(done<list.length?' disabled':'')+'>答え合わせ'+(done<list.length?'(あと'+(list.length-done)+'問)':'')+'</button>';
  }else{
    const sc=list.filter((q,k)=>ans[k]===q[2]).length,pct=Math.round(sc/list.length*100);
    h='<div class="card'+(pct==100?' perfect':'')+'">'+(pct==100?'<div class="big100">100<span>点</span></div><div class="pmsg">全問正解!完璧です</div><div class="sub" style="text-align:center">'+sc+' / '+list.length+'問 正解</div>':'<div class="score">'+sc+' / '+list.length+'<div class="sub">'+pct+'点'+(pct>=80?' 合格ライン':' もう一度復習しましょう')+'</div></div>')+
      '<button class="start" id="re">同じ問題数でもう一度</button><button class="start" id="hm" style="background:var(--sub)">問題数を選び直す</button></div>'+h;
  }
  app.innerHTML=h;
  if(graded&&!fxDone&&list.every((q,k)=>ans[k]===q[2])){fxDone=true;celebrate()}
  app.querySelectorAll('.btns button[data-k]').forEach(b=>b.onclick=()=>{
    const y=window.scrollY;ans[+b.dataset.k]=b.dataset.v==='1';render();window.scrollTo(0,y);
  });
  const g=document.getElementById('g');if(g)g.onclick=()=>{graded=true;render();window.scrollTo(0,0)};
  const re=document.getElementById('re');if(re)re.onclick=()=>start(lastN);
  const hm=document.getElementById('hm');if(hm)hm.onclick=home;
}
home();
</script>
</body>
</html>
