<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zero City ルールテスト</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1d2330;--sub:#667085;--ok:#1a9e5c;--ng:#d6382f;--accent:#2f5bea;--line:#e3e6ec}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--text:#eef0f4;--sub:#9aa3b2;--line:#2b3240}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI","Meiryo",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;margin:8px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
.sub{color:var(--sub);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.cat{display:inline-block;font-size:.75rem;background:var(--accent);color:#fff;border-radius:99px;padding:1px 10px}
.q{font-size:1.15rem;font-weight:700;margin:12px 0 18px}
.btns{display:flex;gap:12px}
.btns button{flex:1;font-size:2.4rem;padding:12px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.btns button.sel{border-color:var(--accent);background:rgba(47,91,234,.15)}
.card.ok{border-color:var(--ok)}
.card.ng{border-color:var(--ng)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:6px 14px;font-size:.9rem;cursor:pointer}
.chip.on{border-color:var(--accent);background:rgba(47,91,234,.15)}
.btns button:disabled{opacity:.4}
.start:disabled{opacity:.45;cursor:not-allowed}
.btns button.cnt{font-size:1.3rem;padding:18px 0}
.btns button:hover:not(:disabled){border-color:var(--accent)}
.btns button:disabled{cursor:default;opacity:.55}
.btns button.pick{opacity:1}
.res{margin-top:16px;padding:12px 14px;border-radius:10px;display:none}
.res.ok{background:rgba(26,158,92,.13);border-left:4px solid var(--ok)}
.res.ng{background:rgba(214,56,47,.13);border-left:4px solid var(--ng)}
.res b{display:block;font-size:1.05rem}
.next,.start{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:1rem;cursor:pointer}
.score{font-size:2.6rem;font-weight:800;text-align:center}
.rev{border-top:1px solid var(--line);padding:10px 0;font-size:.92rem}
.rev:first-child{border-top:0}
</style>
</head>
<body>
<main>
<h1>Zero City ルールテスト 〇×</h1>
<div class="sub" id="head"></div>
<div class="bar"><i id="bar"></i></div>
<div id="app"></div>
</main>

["個人医","ピックの動線上でPDをP殺した場合は適用外(投降なし)。",[["個人医がピックの動線上でPDをP殺した場合も、手を挙げて投降する。",false],["個人医がピックの動線上でPDをP殺した場合は、投降のルールは適用外である。",true]]],
["インパウンド","犯罪現場での車両インパウンドの費用は一律10万円です(例外:違法駐車は30万円、全滅時は0円)。",[["犯罪現場での車両インパウンドの費用は、犯罪の規模によって変わる。",false],["犯罪現場での車両インパウンドの費用は、一律10万円である。",true]]],

const app=document.getElementById('app'),head=document.getElementById('head'),bar=document.getElementById('bar');
let list,ans,graded;
const shuffle=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};

const CATS=[...new Set(G.map(g=>g[0]))];
let selCats=new Set(CATS);
function pool(){return G.filter(g=>selCats.has(g[0]))}
function home(){
  head.textContent="問題数を選んでスタート";bar.style.width="0";
  const p=pool().length;
  app.innerHTML='<div class="card"><p>Zero City のPDルールの理解度チェックです。全問に答えてから「答え合わせ」を押すと結果が出ます。</p>'+
  '<div class="sub" style="margin-top:14px">問題数(全'+p+'問)</div>'+
  '<div class="btns" style="margin-top:6px">'+[15,20,25].map(n=>'<button class="cnt" data-n="'+n+'"'+(p?'':' disabled')+'>'+(n>p&&p?p+'問':n+'問')+'</button>').join('')+
  '<button class="cnt" data-n="0"'+(p?'':' disabled')+'>全問</button></div></div>';
  app.querySelectorAll('.cnt').forEach(b=>b.onclick=()=>start(+b.dataset.n));
}
function start(n){
  const pl=pool();if(!pl.length)return;
  if(!n||n>pl.length)n=pl.length;
  list=shuffle(pl).slice(0,n).map(([c,e,v])=>{const p=v[Math.floor(Math.random()*v.length)];return [c,p[0],p[1],e]});
  ans=new Array(n).fill(null);graded=false;render();window.scrollTo(0,0);
}
function render(){
  const done=ans.filter(v=>v!==null).length;
  head.textContent=graded?"結果":"回答済み "+done+" / "+list.length;
  bar.style.width=(done/list.length*100)+"%";
  let h='';
  list.forEach((q,k)=>{
    const a=ans[k];let cls='';
    if(graded)cls=a===q[2]?' ok':' ng';
    h+='<div class="card'+cls+'"><span class="cat">'+q[0]+'</span><div class="q">'+(k+1)+'. '+q[1]+'</div>'+
    '<div class="btns"><button data-k="'+k+'" data-v="1" class="'+(a===true?'sel':'')+'"'+(graded?' disabled':'')+'>〇</button>'+
    '<button data-k="'+k+'" data-v="0" class="'+(a===false?'sel':'')+'"'+(graded?' disabled':'')+'>×</button></div>';
    if(graded)h+='<div class="res '+(a===q[2]?'ok':'ng')+'" style="display:block"><b>'+
      (a===null?'未回答 / 正解は '+(q[2]?'〇':'×'):a===q[2]?'〇 正解!':'× 不正解… 正解は '+(q[2]?'〇':'×'))+'</b>'+q[3]+'</div>';
    h+='</div>';
  });
  if(!graded){
    h+='<button class="start" id="g"'+(done<list.length?' disabled':'')+'>答え合わせ'+(done<list.length?'(あと'+(list.length-done)+'問)':'')+'</button>';
  }else{
    const sc=list.filter((q,k)=>ans[k]===q[2]).length,pct=Math.round(sc/list.length*100);
    h='<div class="card"><div class="score">'+sc+' / '+list.length+'<div class="sub">'+pct+'点'+(pct==100?' 🎉 完璧!':pct>=80?' 合格ライン':' もう一度復習しましょう')+'</div></div>'+
      '<button class="start" id="re">同じ問題数でもう一度</button><button class="start" id="hm" style="background:var(--sub)">問題数を選び直す</button></div>'+h;
  }
  app.innerHTML=h;
  app.querySelectorAll('.btns button[data-k]').forEach(b=>b.onclick=()=>{
    const y=window.scrollY;ans[+b.dataset.k]=b.dataset.v==='1';render();window.scrollTo(0,y);
  });
  const g=document.getElementById('g');if(g)g.onclick=()=>{graded=true;render();window.scrollTo(0,0)};
  const re=document.getElementById('re');if(re)re.onclick=()=>start(list.length);
  const hm=document.getElementById('hm');if(hm)hm.onclick=home;
}
home();
</script>
</body>
</html>
